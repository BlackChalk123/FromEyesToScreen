<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随视 · 灰阶设计系统</title><link rel="stylesheet" href="tokens.css"><style>*{box-sizing:border-box}body{font:400 14px/1.5 var(--font);background:var(--surface);color:var(--text);max-width:960px;margin:auto;padding:48px 24px}h1{font-size:30px;line-height:1.25}h2{font-size:18px;margin-top:48px}p{color:var(--text-secondary);max-width:35em}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:72px}.swatch i{display:block;height:64px;border-radius:8px;border:1px solid var(--border);background:var(--value)}.swatch span{display:block;margin-top:8px;font-size:12px}button{font:600 14px var(--font);padding:12px 24px;border:0;border-radius:8px;background:var(--action);color:var(--action-text)}.secondary{background:var(--surface-sunken);color:var(--text)}.shadows{display:flex;gap:24px;flex-wrap:wrap}.shadows div{padding:24px;border-radius:12px;background:var(--surface-raised)}.spacer{background:var(--gray-300);height:8px;margin:12px 0}.row{display:flex;align-items:center;gap:24px;margin-top:24px}a{color:var(--text)}</style><h1>随视 · 黑白灰</h1><p>中性、克制、安静。界面退后，内容成为主角。详细规则见 DESIGN.md。</p><h2>灰阶 / 零饱和度</h2><div class="swatches" id="swatches"></div><h2>文字层级与动作</h2><p style="color:var(--text)">主要信息 #181818 · 400 / 600</p><p>次要信息 #555555</p><p style="color:var(--text-muted)">辅助信息 #6a6a6a</p><div class="row"><button>唯一主操作</button><button class="secondary">次要操作</button><a href="index.html">返回原型</a></div><h2>字号</h2><div id="type"></div><h2>间距</h2><div id="space"></div><h2>深度</h2><div class="shadows" id="shadows"></div><script>for(const s of [50,100,200,300,400,500,600,700,800,900,950]){const e=document.createElement('div');e.className='swatch';e.style.setProperty('--value',`var(--gray-${s})`);e.innerHTML=`<i></i><span>${s}</span>`;document.getElementById('swatches').append(e)}for(const s of [12,14,16,18,20,24,30,36]){const p=document.createElement('p');p.style.fontSize=s+'px';p.textContent=`${s}px 随着视线，自然观看`;document.getElementById('type').append(p)}for(const s of [4,8,12,16,24,32,48,64,96]){const e=document.createElement('div');e.textContent=s+'px';const b=document.createElement('div');b.className='spacer';b.style.width=s+'px';e.append(b);document.getElementById('space').append(e)}for(let s=1;s<=5;s++){const e=document.createElement('div');e.style.boxShadow=`var(--shadow-${s})`;e.textContent='层级 '+s;document.getElementById('shadows').append(e)}</script></html>
